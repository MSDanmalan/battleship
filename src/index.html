<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship</title>
</head>
<body>
    <header>
        <h1 class="title">BATTLESHIP</h1>
    </header>
    <main>
        <p id="game-status" role="status" aria-live="polite" aria-atomic="true">
            Press Start Game to begin.
        </p>
        <p id="computer-board-instructions">
            Use the arrow keys to move on the computer board; press Enter or Space to attack.
        </p>
        <div class="container"></div>
        <div class="nav">
            <button id="start-game" class="start">Start Game</button>
        </div>
    </main>
</body>
</html>
